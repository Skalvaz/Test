<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebruli · Ses denemesi</title>
<link rel="icon" href="data:,">
<meta name="color-scheme" content="dark">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0B2B2E; color: #F3E9D2; font: 500 14px/1.35 "Alegreya Sans", system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px 28px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 2px; font: 700 30px/1.1 "Cormorant Garamond", Georgia, serif; color: #E8CD6A; }
  .alt { margin: 0 0 10px; color: #CDB892; font-size: 13px; }
  section { background: #3B2416; border: 1.5px solid #7A5233; border-radius: 10px; padding: 8px 10px 10px; margin: 10px 0; }
  h2 { margin: 0 0 6px; font: 800 12px/1.2 "Alegreya Sans", system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #E8CD6A; }
  .izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
  button { font: 800 13px/1.1 "Alegreya Sans", system-ui, sans-serif; color: #1E1A16; background: #F3E9D2; border: 1.5px solid #C9A227; border-radius: 8px; padding: 8px 6px; min-height: 38px; touch-action: manipulation; }
  button:active { background: #E8CD6A; }
  button.koyu { background: #5A3A22; color: #F3E9D2; }
  button.koyu[aria-pressed="true"] { background: #2F7D4F; }
  .ayar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .ayar label { display: grid; gap: 2px; font-size: 12px; font-weight: 800; color: #CDB892; }
  input[type=range] { width: 100%; accent-color: #C9A227; }
  #dalga { width: 100%; height: 70px; display: block; background: #0A1E33; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font: 600 12px/1.3 ui-monospace, Menlo, monospace; }
  th, td { text-align: right; padding: 2px 4px; border-bottom: 1px solid #ffffff14; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  td.kotu { color: #FF8A7A; } td.iyi { color: #9FE0B4; }
  #ozet { font-weight: 800; color: #E8CD6A; margin: 4px 0; }
</style>
</head>
<body>
<h1>Ses denemesi</h1>
<p class="alt" id="durum">Bağlam kapalı — ilk dokunuşla açılır.</p>
<canvas id="dalga"></canvas>
<div id="kok"></div>
<section><h2>Ölçüm (OfflineAudioContext)</h2>
  <button id="olcDugme">Ölç</button>
  <div id="ozet"></div>
  <table id="tablo"><thead><tr><th>senaryo</th><th>tepe dB</th><th>50 ms dB</th><th>RMS dB</th><th>kırpılan</th><th>&gt;0,8</th><th>durum</th></tr></thead><tbody></tbody></table>
</section>
<script type="module" src="../src/audio/dev/ses.ts"></script>
</body>
</html>
