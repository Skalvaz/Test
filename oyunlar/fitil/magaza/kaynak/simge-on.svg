<?xml version="1.0" encoding="UTF-8"?>
<!--
  FİTİL uygulama simgesi — ÖN katman (uyarlanabilir simge, docs/ANDROID.md §4).
  Tuval 108×108 dp, saydam zemin. Her şey ortadaki 66 dp'lik güvenli dairenin
  içinde (merkez 54,54; yarıçap ≤ 33): başlatıcı maskesi ve açılış perdesinin
  2/3 dairesi hiçbir parçayı kesmez.
  Oyunun can simgesiyle aynı dil (src/ui/ikonlar.ts fitilCanIsaretleme):
  örgülü ip (ftl-ip renkleri), kömürleşmiş uç, köz, krem kıvılcım yıldızı,
  sıcak hale; çevresinde fişek gibi saçılan kıvılcım ışınları.
  Kimlikler "o-" önekli.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <radialGradient id="o-hale" cx="64" cy="42" r="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4C2" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#FFB020" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o-koz" cx=".4" cy=".36" r=".64">
      <stop offset="0" stop-color="#FFFBE6"/>
      <stop offset=".4" stop-color="#FFD15C"/>
      <stop offset=".8" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#E8561A"/>
    </radialGradient>
    <!-- Örgü: ipe çapraz düşen bükümler (oyunun ftl-ip deseni, 52°). -->
    <pattern id="o-ip" width="4.4" height="4.4" patternUnits="userSpaceOnUse" patternTransform="rotate(52)">
      <rect width="4.4" height="4.4" fill="#A8743C"/>
      <rect width="1.7" height="4.4" fill="#E8BC82"/>
      <rect x="3.6" width=".8" height="4.4" fill="#7A4E26"/>
    </pattern>
    <!-- İpin son ~6 dp'si kömürleşir (köze doğru koyulaşır). -->
    <linearGradient id="o-kor" gradientUnits="userSpaceOnUse" x1="53" y1="55" x2="62" y2="45">
      <stop offset="0" stop-color="#2A1408" stop-opacity="0"/>
      <stop offset=".55" stop-color="#2A1408" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7A2E10" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Çizim 0,84 kat, ağırlık merkezi (58,5; 51) tuvalin ortasına: en uzak parça merkezden 32,9 dp. -->
  <g transform="translate(54 54) scale(.84) translate(-58.5 -51)">
  <!-- Hale -->
  <circle cx="64" cy="42" r="19" fill="url(#o-hale)"/>

  <!-- İp: koyu kenar + örgü + köze doğru kömürleşme (yumuşak S) -->
  <path d="M35 76C40.5 78.5 45.5 72 46 65S53.5 54 62.6 43.6" fill="none" stroke="#2A1408" stroke-width="9.6" stroke-linecap="round"/>
  <path d="M35 76C40.5 78.5 45.5 72 46 65S53.5 54 62.6 43.6" fill="none" stroke="url(#o-ip)" stroke-width="6.2" stroke-linecap="round"/>
  <path d="M35 76C40.5 78.5 45.5 72 46 65S53.5 54 62.6 43.6" fill="none" stroke="url(#o-kor)" stroke-width="6.4" stroke-linecap="round"/>

  <!-- Kıvılcım ışınları (fişek saçılması) -->
  <g stroke-linecap="round" fill="none">
    <path d="M70.5 35.5 77 29" stroke="#FFD15C" stroke-width="2.2"/>
    <path d="M73 43.6 81.6 45" stroke="#FFB020" stroke-width="2"/>
    <path d="M64.8 33 65.6 24.4" stroke="#FFE08A" stroke-width="1.8"/>
    <path d="M57 35.6 51.6 30.2" stroke="#FFB020" stroke-width="1.7"/>
    <path d="M70.4 49.6 75.6 55.4" stroke="#FFD15C" stroke-width="1.7"/>
  </g>
  <g>
    <circle cx="80.4" cy="26" r="1.5" fill="#FFF4C2"/>
    <circle cx="84.6" cy="45.4" r="1.2" fill="#FFD15C"/>
    <circle cx="49" cy="27.6" r="1.1" fill="#FFD15C"/>
    <circle cx="77.8" cy="58" r="1.1" fill="#FFB020"/>
    <circle cx="66" cy="21.2" r="1" fill="#FFE08A"/>
  </g>

  <!-- Köz ve krem yıldız -->
  <circle cx="63.6" cy="42.6" r="5" fill="url(#o-koz)"/>
  <path d="M64 30.4 65.5 40.6 74.6 42.2 65.5 43.8 64 54 62.5 43.8 53.4 42.2 62.5 40.6z" fill="#FFF4C2" stroke="#FFB020" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="64" cy="42.2" r="2" fill="#FFFFFF"/>
  </g>
</svg>
