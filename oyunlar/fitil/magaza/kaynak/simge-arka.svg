<?xml version="1.0" encoding="UTF-8"?>
<!--
  FİTİL uygulama simgesi — ARKA katman (uyarlanabilir simge, docs/ANDROID.md §4).
  Tuval 108×108 dp; başlatıcı ortadaki 72×72'yi gösterir (maske: daire,
  yuvarlak kare …), kenarlar paralaks için taşar. Gece göğü (GDD §13.1:
  #0B1030 → #2A1450), ön katmanın kıvılcımına doğru hafif sıcak ışık ve
  seyrek yıldızlar (küçük boyda kaybolur, büyükte doku verir).
  Kimlikler "a-" önekli: üretim betiği katmanları aynı sayfaya gömer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="a-gok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1030"/>
      <stop offset=".55" stop-color="#1A1240"/>
      <stop offset="1" stop-color="#2A1450"/>
    </linearGradient>
    <radialGradient id="a-isik" cx="59" cy="46" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#B8642E" stop-opacity=".12"/>
      <stop offset="1" stop-color="#B8642E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="108" height="108" fill="url(#a-gok)"/>
  <rect width="108" height="108" fill="url(#a-isik)"/>
  <g fill="#FFF3D6">
    <circle cx="30" cy="31" r=".9" opacity=".75"/>
    <circle cx="41" cy="24.5" r=".6" opacity=".55"/>
    <circle cx="25" cy="47" r=".6" opacity=".5"/>
    <circle cx="84" cy="66" r=".8" opacity=".6"/>
    <circle cx="76" cy="80" r=".6" opacity=".45"/>
    <circle cx="51" cy="84" r=".55" opacity=".4"/>
    <circle cx="86" cy="29" r=".55" opacity=".5"/>
  </g>
</svg>
